# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json
services:
    _defaults:
        autowire:      true
        autoconfigure: true

    Psr\Log\LoggerInterface:
        alias: monolog.logger.contao

    HeimrichHannot\FlareBundle\:
        resource: ../src
        exclude:
            - ../src/{Config,Contao,ContaoManager,Contract,DependencyInjection,Dto,Engine,Event,Integration,Model,Trait,Util}
            - ../src/{Filter,Form,InferPtable,List,Paginator,Query,Sort}/*.php
            - ../src/DataContainer/Builder

    HeimrichHannot\FlareBundle\Engine\:
        resource: ../src/Engine
        exclude:
            - ../src/Engine/Engine.php
            - ../src/Engine/Context/*.php
            - ../src/Engine/Loader
            - ../src/Engine/View

    # Util classes registered as twig globals must be defined as services
    HeimrichHannot\FlareBundle\Util\Env: ~
    HeimrichHannot\FlareBundle\Util\Str: ~

    # Not shared: each consumer keeps its own per-key schema memoization space
    HeimrichHannot\FlareBundle\Config\SchemaResolver:
        shared: false

#    bind:
#      $projectDir: '%kernel.project_dir%'
#      $csrfTokenName: '%contao.csrf_token_name%'
#      $kernelBundles: '%kernel.bundles%'
