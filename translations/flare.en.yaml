reader:
    back_to_list: "Back to list"
    default_template:
        warning: "Default template selected"
        description: "Please create/select a custom template for this FLARE reader."
    invalid_list: "No valid list selected"

list:
    failed: "The list could not be created."

    default_template:
        warning: "Default template selected"
        description: "Please create/select a custom template for this FLARE list."

    info:
        no_published_filter: "Entries in this list have a publication status (%target%). No publication filter is configured to account for this."
        duplicate_filter_alias: "Duplicate filter aliases: %alias%. The list cannot be created until each published filter has a unique alias."
        broken_filters: "{1} One filter breaks the list; it cannot be created until the filter is fixed. It is marked in the list below.|]1,Inf[ %count% filters break the list; it cannot be created until they are fixed. They are marked in the list below."
        ineffective_filters: "{1} One filter has no effect and needs attention; it is marked in the list below.|]1,Inf[ %count% filters have no effect and need attention; they are marked in the list below."

filter:
    value:
        date_range:
            label: "Date range"
            description: "Start and end as a date (e.g. 2026-10-26) or a relative time expression in PHP strtotime() syntax (e.g. today, +1 week, first day of next month). Leave empty for an open bound. Relative expressions are recalculated on every request."
            invalid: '"%expression%" is neither a date nor a valid relative time expression (e.g. today, +1 week, 2026-10-26).'
    limited_scope:
        single: "This filter is limited to the following scope: %scopes%"
        multiple: "This filter is limited to the following scopes: %scopes%"
        dynamic: "The scope of this filter is dynamically determined based on this configuration."
        disqualified: "This filter is not applicable as the scope is not defined."

    scope:
        list: "list view"
        reader: "reader"
        twig: "twig template"

    info:
        alias: "Alias"
        intrinsic:
            yes: "This filter is intrinsic"
            no: "This filter ist not intrinsic"
        duplicate_alias: "This filter has the alias \"%alias%\", which is already used by another filter."
        broken:
            published: "This filter breaks the list: %reason%"
            unpublished: "Once published, this filter would break the list: %reason%"
        ineffective:
            archive_without_value: "This filter has no control and no value, so it restricts nothing. Select the archives to show as its value, or select a control."

errors:
    choices_not_loaded: "The filter choices could not be loaded; check the list configuration."
    archive:
        no_parents: "No parent archives are whitelisted, or the parent table has no model class."
        no_valid_parents: "None of the whitelisted parent archives exists."
        no_ptable: "The data container of the list has no parent table, so it cannot be filtered by archive."
    missing_model: 'List model or filter model not found.'
    missing_datacontainer: 'Please define a data container on the list model [ID %id%]'

infer_ptable:
    auto: "Parent table of \"%table%.%field%\" inferred as \"%ptable%\""
    dynamic: "Parent table of \"%table%\" can be inferred dynamically"
    invalid: "Parent table cannot be inferred automatically on \"%table%.%field%\""
